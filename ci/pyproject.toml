[project]
name = "datacenter-ci"
version = "0.1.0"
description = "Dagger CI pipeline for the datacenter simulator"
requires-python = ">=3.12"
dependencies = [
  "dagger-io==0.21.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacenter_ci"]
