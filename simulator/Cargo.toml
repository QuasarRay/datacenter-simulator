[package]
name = "datacenter-simulator"
version = "0.1.0"
edition = "2024"
license = "RPL-1.5"
description = "Rust datacenter simulation using the NVIDIA Air SDK as a behavioral blueprint"
publish = false

[workspace]
exclude = ["vendor/nccl", "vendor/patchbay", "vendor/petgraph", "vendor/rust-ibverbs"]

[features]
default = []
linux = ["dep:patchbay", "dep:tokio", "dep:anyhow"]
incus = ["linux"]
ibsim = ["linux", "patchbay/ibsim"]
netbox = ["dep:reqwest", "dep:anyhow"]
mokka = ["dep:serde_yaml", "dep:anyhow", "dep:nix"]
vm = ["linux", "dep:libc", "dep:nix"]
rdma = ["dep:ibverbs", "dep:anyhow"]
nccl = ["dep:nccl", "dep:libloading", "linux"]
nccl-check = ["nccl", "nccl/no-link"]

[dependencies]
ncp-assessment-kernel = { path = "../education/rustlings/lab-kernel" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde_yaml = { version = "0.9", optional = true }
nix = { version = "0.31", features = ["signal", "process"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
petgraph = { path = "vendor/petgraph/crates/petgraph", default-features = false, features = ["std"] }
patchbay = { path = "vendor/patchbay/patchbay", optional = true }
ibverbs = { path = "vendor/rust-ibverbs/ibverbs", optional = true }
nccl = { path = "vendor/nccl/bindings/rust/nccl", optional = true }
anyhow = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "process"], optional = true }

libloading = { version = "0.8", optional = true }

libc = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1"

[[example]]
name = "linux_fabric"
required-features = ["linux"]

[[example]]
name = "rdma_loopback"
required-features = ["rdma"]

[[example]]
name = "nccl_runtime"
required-features = ["nccl"]

[[example]]
name = "ibsim_fabric"
required-features = ["ibsim"]
