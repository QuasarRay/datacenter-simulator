name: incus-live-qualification
on:
  workflow_dispatch:
    inputs:
      config:
        description: Absolute path to the dedicated runner's reviewed configuration
        required: true
      state:
        description: New absolute directory on the dedicated runner
        required: true
permissions:
  contents: read
jobs:
  incus:
    runs-on: [self-hosted, linux, cachyos, incus-lab]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - run: cargo test --locked --manifest-path simulator/Cargo.toml --features incus --test incus
      - run: cargo build --locked --manifest-path simulator/Cargo.toml --features incus
      - name: Create isolated owned lab
        env:
          NCP_CONFIG: ${{ inputs.config }}
          NCP_STATE: ${{ inputs.state }}
        run: simulator/target/debug/datacenter-simulator incus-up "$NCP_CONFIG" "$NCP_STATE"
      - name: Execute upstream DeepOps role
        env:
          NCP_STATE: ${{ inputs.state }}
        run: |
          python3 - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'integrations/incus')
          from lab import Lab
          Lab(os.environ['NCP_STATE']).reconcile_hosts()
          PYTHON
      - name: Remove only owned resources
        if: always()
        env:
          NCP_STATE: ${{ inputs.state }}
        run: simulator/target/debug/datacenter-simulator incus-down "$NCP_STATE"
