name: nccl-runtime
on:
  push:
    branches: [main]
    paths: ['simulator/**', 'integrations/**', '.github/workflows/nccl-runtime.yml']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nccl:
    # Explicit hardware gate: two CUDA GPUs, CUDA toolkit, namespace privileges,
    # ip/tc/nft/sysctl/ping and Rust native build dependencies must be installed.
    runs-on: [self-hosted, linux, nccl]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build the pinned NCCL implementation
        working-directory: simulator
        run: |
          nvidia-smi
          nvcc --version
          make -C vendor/nccl -j2 src.build
      - name: Build native Rust execution and hardware checks
        working-directory: simulator
        env:
          NCCL_LIB_DIR: ${{ github.workspace }}/simulator/vendor/nccl/build/lib
        run: cargo +1.98.0 build --locked --features nccl --bin datacenter-simulator --example nccl_runtime
      - name: Require real NCCL over the namespace fabric
        working-directory: simulator
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/simulator/vendor/nccl/build/lib
        run: |
          nccl=$(readlink -f "$LD_LIBRARY_PATH/libnccl.so.2")
          cuda=$(ldconfig -p | awk '/libcuda.so.1 .*x86-64/ {print $NF; exit}')
          cuda=$(readlink -f "$cuda")
          test -f "$nccl" && test -f "$cuda"
          jq -n --arg nccl "$nccl" --arg cuda "$cuda" --arg nccl_sha "$(sha256sum "$nccl" | cut -d ' ' -f1)" --arg cuda_sha "$(sha256sum "$cuda" | cut -d ' ' -f1)" '{nccl:{path:$nccl,sha256:$nccl_sha},cuda:{path:$cuda,sha256:$cuda_sha}}' > /tmp/nccl-libraries.json
          timeout 240 ./target/debug/examples/nccl_runtime /tmp/nccl-libraries.json
          timeout 90 ./target/debug/datacenter-simulator run examples/gpu-spine-leaf.json --devices 0,1 --libraries /tmp/nccl-libraries.json
