name: rust-simulator
on:
  pull_request:
    paths: ['simulator/**', '.gitmodules', '.github/workflows/rust-simulator.yml']
  push:
    branches: [main, codex/rust-air-simulator]
    paths: ['simulator/**', '.gitmodules', '.github/workflows/rust-simulator.yml']
permissions:
  contents: read
concurrency:
  group: rust-simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        working-directory: simulator
        run: |
          cargo +1.98.0 fmt --package datacenter-simulator --check

      - name: Portable contracts and property tests
        working-directory: simulator
        run: cargo +1.98.0 test --locked --all-targets
      - name: Runnable GPU datacenter scenario
        working-directory: simulator
        run: cargo +1.98.0 run --locked -- run examples/gpu-spine-leaf.json
      - name: Rust lint
        working-directory: simulator
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - name: Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 iputils-ping clang libclang-dev cmake pkg-config libibverbs-dev librdmacm-dev libnl-3-dev libnl-route-3-dev libudev-dev
      - name: Compile all integrations including NCCL ABI without linking CUDA
        working-directory: simulator
        run: cargo +1.98.0 check --locked --all-targets --features linux,rdma,nccl-check
      - name: Build Linux and RDMA executables
        id: native_build
        working-directory: simulator
        run: cargo +1.98.0 build --locked --examples --features linux,rdma
      - name: Real namespaces TCP delivery partition and recovery
        working-directory: simulator
        run: sudo timeout 90 ./target/debug/examples/linux_fabric
      - name: SoftRoCE send and receive
        if: always() && steps.native_build.outcome == 'success'
        working-directory: simulator
        run: |
          sudo modprobe rdma_rxe
          sudo ip link add sim-rxe type veth peer name sim-peer
          trap 'sudo rdma link delete sim_rxe; sudo ip link delete sim-rxe' EXIT
          sudo ip addr add 192.0.2.1/24 dev sim-rxe
          sudo ip link set sim-rxe up
          sudo ip link set sim-peer up
          sudo rdma link add sim_rxe type rxe netdev sim-rxe
          sudo timeout 15 ./target/debug/examples/rdma_loopback
