name: datacenter-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/check_metablueprint.py
      - run: python3 -m unittest discover -s tests -p 'test_ncp*.py'
      - run: python3 -m unittest discover -s tests -p test_metablueprint.py
      - run: python3 tools/check_native_runtime.py
