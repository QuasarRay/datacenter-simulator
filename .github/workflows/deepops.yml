name: deepops-native-adapter
on:
  pull_request:
    paths: ['integrations/incus/**', '.github/workflows/deepops.yml']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - run: python3 -m pip install ansible-core==2.19.8
      - run: ansible-playbook -i localhost, integrations/incus/provision.yml --syntax-check
      - run: ansible-playbook -i localhost, integrations/incus/services.yml --syntax-check
