name: NCP assessment contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init education/rustlings
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: python3 tools/check_metablueprint.py
      - run: |
          python3 tools/build_assessment_bank.py
          git diff --exit-code -- education/assessment/bank.json
      - run: cargo +1.98.0 test --locked --manifest-path education/assessment/Cargo.toml
