dc:
  name: gpu-dc

  mgmt:
    network: gpu-dc-mgmt
    subnet: 172.30.0.0/24

  profiles:
    spine:
      kind: linux
      image: frrouting/frr:<pinned-version>
      cpu: 0.5
      memory: 256Mb

    leaf:
      kind: linux
      image: frrouting/frr:<pinned-version>
      cpu: 0.5
      memory: 256Mb

    server:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:<pinned-version>
      cpu: 1
      memory: 512Mb

  nodes:

    spine1:
      role: spine
      mgmt_ip: 172.30.0.11
      asn: 65001
      loopback: 10.255.0.1/32

    spine2:
      role: spine
      mgmt_ip: 172.30.0.12
      asn: 65002
      loopback: 10.255.0.2/32

    leaf1:
      role: leaf
      mgmt_ip: 172.30.0.21
      asn: 65101
      loopback: 10.255.1.1/32

    leaf2:
      role: leaf
      mgmt_ip: 172.30.0.22
      asn: 65102
      loopback: 10.255.1.2/32