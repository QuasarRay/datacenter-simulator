---
- name: Locate portable public host trust
  ansible.builtin.set_fact:
    ex457_trust_path: "{{ lookup('ansible.builtin.env', 'EX457_KNOWN_HOSTS') | default(playbook_dir + '/../.state/known_hosts', true) }}"
- name: Check trust input exists in the execution environment
  ansible.builtin.stat:
    path: "{{ ex457_trust_path }}"
  register: ex457_trust_stat
  delegate_to: localhost
- name: Require an explicitly supplied trust file
  ansible.builtin.assert:
    that:
      - ex457_trust_stat.stat.isreg | default(false)
      - ex457_trust_stat.stat.size | default(0) > 0
- name: Supply the known-hosts option supported by the pinned binding
  ansible.builtin.set_fact:
    ansible_libssh_known_hosts: "{{ ex457_trust_path }}"
    ansible_host_key_checking: true
    ansible_libssh_host_key_auto_add: false
