---
- name: Render candidate using the supplied template
  ansible.builtin.set_fact:
    fabric_candidate: "{{ lookup('ansible.builtin.template', playbook_dir + '/../templates/fabric.conf.j2') }}"
- name: Require deliberate apply selection
  ansible.builtin.assert:
    that: fabric_apply | bool
- name: Read state before computing explicit removals
  ansible.netcommon.cli_command:
    command: show running-config
  register: fabric_before
  changed_when: false
- name: Compute managed removals
  ansible.builtin.set_fact:
    fabric_removals: "{{ fabric_before.stdout | fabric_reconcile(fabric_intent) }}"
- name: Remove stale managed state
  ansible.netcommon.cli_config:
    config: "{{ fabric_removals }}"
  when: fabric_removals | length > 0
- name: Apply intended configuration
  ansible.netcommon.cli_config:
    config: "{{ fabric_candidate }}"
