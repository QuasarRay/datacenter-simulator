---
- name: Wait for exact unfiltered peer set, state and remote ASNs
  ansible.netcommon.cli_command:
    command: show bgp ipv4 unicast summary json
  register: bgp_summary
  changed_when: false
  until: bgp_summary.stdout | fabric_peers_ready(fabric_intent)
  retries: 30
  delay: 2
- name: Read running configuration
  ansible.netcommon.cli_command:
    command: show running-config
  register: running_config
  changed_when: false
- name: Compare interface-scoped addresses and BGP configuration
  ansible.builtin.assert:
    that: running_config.stdout | fabric_config_ok(fabric_intent)
- name: Verify each modeled remote prefix
  ansible.builtin.include_tasks: verify_remote.yml
  loop: "{{ fabric_intent.remote_nodes }}"
  loop_control:
    loop_var: remote_node
