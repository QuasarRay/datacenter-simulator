---
- name: Verify and save integrated FRR state
  hosts: fabric
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../model-upstream.yml
  pre_tasks:
    - name: Derive model
      ansible.builtin.import_tasks: tasks/model.yml
    - name: Bootstrap strict libssh trust
      ansible.builtin.import_tasks: tasks/trust.yml
  tasks:
    - name: Run network exercise
      block:
        - name: Verify current control plane
          ansible.builtin.import_tasks: tasks/verify.yml
        - name: Save integrated configuration
          ansible.netcommon.cli_command:
            command: write memory
          changed_when: true
        - name: Read saved configuration
          ansible.netcommon.cli_command:
            command: show startup-config
          register: saved_config
          changed_when: false
        - name: Compare the saved managed state to the source of truth
          ansible.builtin.assert:
            that: saved_config.stdout | fabric_config_ok(fabric_intent)
      always:
        - name: Clean temporary trust configuration
          ansible.builtin.include_tasks: tasks/cleanup_trust.yml
