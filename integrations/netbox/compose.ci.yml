# Ephemeral CI only. Credentials are intentionally public test data.
services:
  netbox:
    image: netboxcommunity/netbox:v4.7-5.1.1
    ports: ['127.0.0.1:8000:8080']
    depends_on: [postgres, redis]
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: simulator-ci
      REDIS_HOST: redis
      REDIS_CACHE_HOST: redis
      REDIS_DATABASE: '0'
      REDIS_CACHE_DATABASE: '1'
      SECRET_KEY: simulator-ci-only-secret-key-at-least-fifty-characters-long
      API_TOKEN_PEPPER_1: simulator-ci-only-api-pepper-at-least-fifty-characters-long
      ALLOWED_HOSTS: '*'
      SKIP_SUPERUSER: 'false'
      SUPERUSER_NAME: admin
      SUPERUSER_PASSWORD: simulator-ci
      SUPERUSER_API_KEY: SimTestKey01
      SUPERUSER_API_TOKEN: '0123456789012345678901234567890123456789'
      GRANIAN_WORKERS: '1'
      MAX_DB_WAIT_TIME: '90'
    healthcheck:
      test: ['CMD-SHELL', /opt/netbox/health.sh]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: simulator-ci
  redis:
    image: valkey/valkey:9.1-alpine
