---
- name: Provision the owned declared OS through real DeepOps roles
  hosts: all
  gather_facts: true
  tasks:
    - name: Require the declared guest distribution
      ansible.builtin.assert:
        that:
          - (ncp_declared_os == 'cachyos' and ansible_facts.distribution == 'CachyOS') or (ncp_declared_os == 'ubuntu-24.04' and ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version == '24.04')
        fail_msg: The observed distribution must match the declared image OS; changing distro facts is prohibited.
    - name: Manage node identity using NVIDIA DeepOps
      ansible.builtin.include_role:
        name: deepops_hosts
      vars:
        hosts_file_src: "{{ ncp_hosts_file_src }}"
        hosts_add_ansible_managed_hosts: false
        hosts_entries: "{{ ncp_hosts_entries | default([]) }}"
    - name: Reconcile system network files generated by the lesson
      ansible.builtin.copy:
        dest: "/etc/systemd/network/{{ item.name }}.network"
        content: "{{ item.content }}"
        mode: '0644'
      loop: "{{ ncp_network_files[inventory_hostname] | default([]) }}"
      notify: Restart owned guest networking
    - name: Start the network manager inside the guest
      ansible.builtin.systemd_service:
        name: systemd-networkd
        state: started
        enabled: true
    - name: Reconcile forwarding from the generated device role
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-ncp-forwarding.conf
        content: "net.ipv4.ip_forward={{ 1 if ncp_forwarding[inventory_hostname] else 0 }}\n"
        mode: '0644'
      when: ncp_forwarding is defined
      notify: Apply owned namespace forwarding
  handlers:
    - name: Apply owned namespace forwarding
      ansible.builtin.command:
        argv: [/usr/sbin/sysctl, -p, /etc/sysctl.d/90-ncp-forwarding.conf]
      changed_when: true
    - name: Restart owned guest networking
      ansible.builtin.systemd_service:
        name: systemd-networkd
        state: restarted
