---
- name: Create the Incus datacenter from validated intent
  hosts: labhost
  gather_facts: false
  tasks:
    - name: Require explicit inputs
      ansible.builtin.assert:
        that: [ncp_config is defined, ncp_state is defined, ncp_simulator is defined]
    - name: Validate plan before mutation
      ansible.builtin.command:
        argv: ["{{ ncp_simulator }}", incus-plan, "{{ ncp_config }}"]
      changed_when: false
    - name: Create owned system containers and patchbay cables
      ansible.builtin.command:
        argv: ["{{ ncp_simulator }}", incus-up, "{{ ncp_config }}", "{{ ncp_state }}"]
      changed_when: true
