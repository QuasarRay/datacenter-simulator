---
- name: Deploy virtual datacenter
  hosts: labhost
  gather_facts: false

  vars_files:
    - ../vars/datacenter.yml

  vars:
    project_root: "{{ playbook_dir }}/.."
    topology_file: "{{ project_root }}/build/{{ dc.name }}.clab.yml"

  tasks:
    - name: Ensure build directory exists
      ansible.builtin.file:
        path: "{{ project_root }}/build"
        state: directory
        mode: "0755"

    - name: Render containerlab topology
      ansible.builtin.template:
        src: "../templates/datacenter.clab.yml.j2"
        dest: "{{ topology_file }}"
        mode: "0644"

    - name: Validate containerlab topology
      ansible.builtin.command:
        argv:
          - containerlab
          - validate
          - --topo
          - "{{ topology_file }}"
      changed_when: false

    - name: Deploy containerlab datacenter
      become: true
      ansible.builtin.command:
        argv:
          - containerlab
          - deploy
          - --topo
          - "{{ topology_file }}"
      register: containerlab_deploy

    - name: Show deployment output
      ansible.builtin.debug:
        var: containerlab_deploy.stdout_lines