---
- name: Deploy virtual datacenter
  hosts: labhost
  gather_facts: false

  vars_files:
    - ../vars/datacenter.yml

  vars:
    project_root: "{{ playbook_dir }}/.."
    topology_file: "{{ project_root }}/build/{{ dc.name }}.clab.yml"

  tasks:
    - name: Ensure build directory exists
      ansible.builtin.file:
        path: "{{ project_root }}/build"
        state: directory
        mode: "0755"

    - name: Render containerlab topology
      ansible.builtin.template:
        src: "../templates/datacenter.clab.yml.j2"
        dest: "{{ topology_file }}"
        mode: "0644"

    - name: Validate containerlab topology
      ansible.builtin.command:
        argv:
          - containerlab
          - validate
          - --topo
          - "{{ topology_file }}"
      changed_when: false

    - name: Inspect resources already owned by this lab
      become: true
      ansible.builtin.command:
        argv: [docker, ps, -a, --filter, "label=containerlab={{ dc.name }}", --format, "{{ '{{.Names}}' }}"]
      register: existing_lab
      changed_when: false

    - name: Refuse to replace an existing or partial lab implicitly
      ansible.builtin.assert:
        that: existing_lab.stdout_lines | length == 0
        fail_msg: "Lab resources already exist. Verify them or run destroy.yml before redeployment."

    - name: Deploy a new lab with failure cleanup
      block:
        - name: Deploy containerlab datacenter
          become: true
          ansible.builtin.command:
            argv: [containerlab, deploy, --topo, "{{ topology_file }}"]
          register: containerlab_deploy
          changed_when: containerlab_deploy.rc == 0
        - name: Verify actual traffic and declared state
          become: true
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", "{{ project_root }}/tests/datacenter_state.py"]
          changed_when: false
      rescue:
        - name: Remove resources from the failed new deployment
          become: true
          ansible.builtin.command:
            argv: [containerlab, destroy, --topo, "{{ topology_file }}", --cleanup]
          register: failed_cleanup
          failed_when: false
          changed_when: failed_cleanup.rc == 0
        - name: Report the original failure and cleanup outcome
          ansible.builtin.fail:
            msg: "Deployment failed: {{ ansible_failed_result }}. Cleanup rc={{ failed_cleanup.rc }}: {{ failed_cleanup.stderr }}"

    - name: Show deployment output
      ansible.builtin.debug:
        var: containerlab_deploy.stdout_lines