---
- name: Remove exactly the resources recorded by the Incus lifecycle
  hosts: labhost
  gather_facts: false
  tasks:
    - name: Require explicit inputs
      ansible.builtin.assert:
        that: [ncp_state is defined, ncp_simulator is defined]
    - name: Verify ownership and remove cables before instances
      ansible.builtin.command:
        argv: ["{{ ncp_simulator }}", incus-down, "{{ ncp_state }}"]
      changed_when: true
